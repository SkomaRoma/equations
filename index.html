<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решатель уравнений</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.0.0/math.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: 'Courier New', monospace;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .clear-btn {
            background: #999;
        }

        .clear-btn:hover {
            box-shadow: 0 10px 20px rgba(153, 153, 153, 0.3);
        }

        .output {
            min-height: 100px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 3px solid #c62828;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 3px solid #2e7d32;
        }

        .message.info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 3px solid #1565c0;
        }

        .emoji {
            font-size: 20px;
            flex-shrink: 0;
        }

        .solution {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #667eea;
            word-break: break-all;
        }

        .symbol-selector {
            display: none;
        }

        .symbol-selector.active {
            display: block;
        }

        .note {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 6px;
            color: #856404;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 Решатель уравнений</h1>

        <div class="input-group">
            <label for="equation">Введите уравнение (например: 2x + 5 = 13)</label>
            <input 
                type="text" 
                id="equation" 
                placeholder="левая_часть = правая_часть"
                autocomplete="off"
            >
        </div>

        <div class="input-group symbol-selector" id="symbolSelector">
            <label for="symbol">Искомый символ</label>
            <select id="symbol"></select>
        </div>

        <div class="button-group">
            <button onclick="solveEquation()">Решить</button>
            <button class="clear-btn" onclick="clearAll()">Очистить</button>
        </div>

        <div class="output" id="output"></div>

        <div class="note">
            💡 <strong>Подсказка:</strong> Используйте * для умножения (2*x), ^ для степени (x^2), 
            и стандартные операторы +, -, /, ( )
        </div>
    </div>

    <script>
        const goodEmojis = [':)', ':]', '<3', '∆_∆', ':P', ':>', 'XD'];
        const badEmojis = [':(', ':[', ':<', '-_-', '._.', ':#', ':l'];
        let lastEmoji = '';
        let solveInProgress = false;

        function getRandomEmoji(mood) {
            const list = mood === 'good' ? goodEmojis : badEmojis;
            let emoji;
            do {
                emoji = list[Math.floor(Math.random() * list.length)];
            } while (emoji === lastEmoji);
            lastEmoji = emoji;
            return emoji;
        }

        function normalize(equation) {
            // Заменяем ^ на **
            equation = equation.replace(/\^/g, '**');
            
            // Добавляем * между:
            // 1) цифрой и буквой (2x -> 2*x)
            equation = equation.replace(/(\d)([a-яА-Яa-zA-Z])/g, '$1*$2');
            
            // 2) буквой и цифрой (x2 -> x*2)
            equation = equation.replace(/([a-яА-Яa-zA-Z])(\d)/g, '$1*$2');
            
            // 3) цифрой/буквой и открывающей скобкой (2( -> 2*( или x( -> x*()
            equation = equation.replace(/(\d)\(/g, '$1*(');
            equation = equation.replace(/([a-яА-Яa-zA-Z])\(/g, '$1*(');
            
            // 4) закрывающей скобкой и цифрой/буквой ()2 -> )*2 или )x -> )*x)
            equation = equation.replace(/\)(\d)/g, ')*$1');
            equation = equation.replace(/\)([a-яА-Яa-zA-Z])/g, ')*$1');
            
            // 5) буквой и буквой (xy -> x*y)
            equation = equation.replace(/([a-яА-Яa-zA-Z])([a-яА-Яa-zA-Z])/g, '$1*$2');
            
            return equation;
        }

        function extractSymbols(equation) {
            // Извлекаем все уникальные буквы (одиночные переменные, не части многобуквенного слова)
            const symbols = new Set();
            const pattern = /[a-яА-Яa-zA-Z]/g;
            let match;
            while ((match = pattern.exec(equation)) !== null) {
                symbols.add(match[0]);
            }
            return Array.from(symbols).sort();
        }

        function solveEquation() {
            if (solveInProgress) return;
            
            const output = document.getElementById('output');
            output.innerHTML = '';

            const equationStr = document.getElementById('equation').value.trim();
            if (!equationStr) {
                showMessage('Пожалуйста, введите уравнение!', 'error', output);
                return;
            }

            const match = equationStr.match(/(.*?)\s*=\s*(.*)/);
            if (!match) {
                showMessage('Неверный формат уравнения. Используйте: выражение = выражение', 'error', output);
                return;
            }

            const symbols = extractSymbols(equationStr);

            if (symbols.length === 0) {
                showMessage('В уравнении не найдены переменные!', 'error', output);
                return;
            }

            if (symbols.length > 1) {
                showSymbolSelector(symbols, output);
                return;
            }

            const symbol = symbols[0];
            solveForSymbol(equationStr, symbol, output);
        }

        function showSymbolSelector(symbols, output) {
            const selector = document.getElementById('symbolSelector');
            const symbolSelect = document.getElementById('symbol');
            symbolSelect.innerHTML = symbols.map(s => `<option value="${s}">${s}</option>`).join('');
            selector.classList.add('active');

            showMessage(`Найдено несколько переменных: ${symbols.join(', ')}. Выберите искомую переменную.`, 'info', output);

            symbolSelect.onchange = () => {
                const symbol = symbolSelect.value;
                const equationStr = document.getElementById('equation').value;
                selector.classList.remove('active');
                solveForSymbol(equationStr, symbol, output);
            };
        }

        function solveForSymbol(equationStr, symbol, output) {
            if (solveInProgress) return;
            solveInProgress = true;

            try {
                const match = equationStr.match(/(.*?)\s*=\s*(.*)/);
                const leftStr = match[1];
                const rightStr = match[2];

                // Нормализуем выражения
                const leftNorm = normalize(leftStr);
                const rightNorm = normalize(rightStr);

                // Создаём выражение для решения
                const expr = `(${leftNorm}) - (${rightNorm})`;

                // Проверяем валидность выражения
                try {
                    math.parse(expr);
                } catch (e) {
                    showMessage(`Синтаксическая ошибка в выражении: ${e.message}`, 'error', output);
                    solveInProgress = false;
                    return;
                }

                // Пытаемся решить символически (для линейных и простых уравнений)
                try {
                    const symbolObj = math.parse(symbol);
                    const exprObj = math.parse(expr);
                    
                    // math.js не имеет встроенного solve, используем численные методы
                    const solutions = numericalSolve(expr, symbol);

                    if (solutions.length === 0) {
                        showMessage('Уравнение не имеет решений', 'error', output);
                    } else {
                        showMessage('✓ Решения уравнения', 'success', output);
                        solutions.forEach(sol => {
                            const solutionDiv = document.createElement('div');
                            solutionDiv.className = 'solution';
                            // Форматируем число
                            const formatted = formatNumber(sol);
                            solutionDiv.textContent = `${symbol} = ${formatted}`;
                            output.appendChild(solutionDiv);
                        });
                    }
                } catch (e) {
                    showMessage(`Ошибка при вычислении: ${e.message}`, 'error', output);
                }

            } catch (error) {
                showMessage(`Ошибка: ${error.message}`, 'error', output);
            } finally {
                solveInProgress = false;
            }
        }

        function numericalSolve(expression, symbol) {
            const solutions = [];
            const compiled = math.compile(expression);
            
            // Расширяем диапазон поиска
            const ranges = [
                { min: -1e10, max: 1e10, step: 1e8 },
                { min: -1e6, max: 1e6, step: 1e4 },
                { min: -1e3, max: 1e3, step: 1 },
                { min: -1, max: 1, step: 0.001 }
            ];

            for (const range of ranges) {
                for (let x = range.min; x <= range.max; x += range.step) {
                    try {
                        const result = compiled.evaluate({ [symbol]: x });
                        if (typeof result === 'number' && Math.abs(result) < 1e-6) {
                            // Проверяем, нет ли уже похожего решения
                            const isDuplicate = solutions.some(s => Math.abs(s - x) < 0.01);
                            if (!isDuplicate) {
                                solutions.push(x);
                            }
                        }
                    } catch (e) {
                        // Пропускаем ошибки вычисления
                    }
                }
                
                // Если уже нашли решения, уточняем их
                if (solutions.length > 0) break;
            }

            // Уточняем решения методом Ньютона-Рафсона
            const refined = [];
            for (let sol of solutions) {
                const refined_sol = newtonRaphson(compiled, symbol, sol);
                refined.push(refined_sol);
            }

            return refined.sort((a, b) => a - b);
        }

        function newtonRaphson(compiled, symbol, initial, maxIter = 10) {
            let x = initial;
            const h = 1e-5;

            for (let i = 0; i < maxIter; i++) {
                try {
                    const f = compiled.evaluate({ [symbol]: x });
                    const f_h = compiled.evaluate({ [symbol]: x + h });
                    const df = (f_h - f) / h;

                    if (Math.abs(df) < 1e-10) break;

                    const x_new = x - f / df;
                    if (Math.abs(x_new - x) < 1e-9) break;

                    x = x_new;
                } catch (e) {
                    break;
                }
            }

            return x;
        }

        function formatNumber(num) {
            if (Math.abs(num) < 1e-10) return '0';
            if (Number.isInteger(num)) return num.toString();
            
            // Проверяем, не простая ли дробь
            for (let denom = 1; denom <= 1000; denom++) {
